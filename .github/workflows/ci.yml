name: CI

on:
  push:
    branches:
      - main
      - develop
      - "release/**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app-v1/requirements.txt
          python -m pip install -r app-v2/requirements.txt
          python -m pip install pyflakes

      - name: Run lint
        run: |
          pyflakes app-v1/app.py app-v2/app.py tests/test_apps.py


  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app-v1/requirements.txt
          python -m pip install -r app-v2/requirements.txt

      - name: Run application tests
        run: |
          python -m unittest discover -s tests -v


  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python compile validation
        run: |
          python -m compileall -q app-v1 app-v2 tests


  security:
    name: Security Basic Validation
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for tracked environment files
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "ERROR: .env is tracked by Git."
            exit 1
          fi

      - name: Check for possible hard-coded secrets
        run: |
          if grep -RniE \
            --exclude-dir=.git \
            --exclude-dir=.venv \
            --exclude='*.pyc' \
            --exclude='.env' \
            'password[[:space:]]*=[[:space:]]*["'\''][^"'\'']+["'\'']|secret[[:space:]]*=[[:space:]]*["'\''][^"'\'']+["'\'']' \
            .; then
            echo "ERROR: Possible hard-coded secret detected."
            exit 1
          fi

      - name: Validate Dockerfiles
        run: |
          test -f docker/app-v1/Dockerfile
          test -f docker/app-v2/Dockerfile
          grep -q '^USER appuser' docker/app-v1/Dockerfile
          grep -q '^USER appuser' docker/app-v2/Dockerfile


  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - test
      - build
      - security

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine image tag
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="ci-${GITHUB_SHA::7}"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Using image version: ${VERSION}"

      - name: Build app-v1 image
        run: |
          docker build \
            -f docker/app-v1/Dockerfile \
            -t app-v1:${{ steps.version.outputs.version }} \
            app-v1

      - name: Build app-v2 image
        run: |
          docker build \
            -f docker/app-v2/Dockerfile \
            -t app-v2:${{ steps.version.outputs.version }} \
            app-v2

      - name: Verify Docker images
        run: |
          docker image inspect app-v1:${{ steps.version.outputs.version }}
          docker image inspect app-v2:${{ steps.version.outputs.version }}

      - name: Verify release tag mapping
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "Release tag: ${GITHUB_REF_NAME}"
          echo "Image tag: ${{ steps.version.outputs.version }}"
