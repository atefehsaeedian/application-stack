global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  - job_name: 'prometheus'
    scrape_interval: 5s
    scrape_timeout: 5s
    static_configs:
      - targets:
          - 'localhost:9090'

  - job_name: 'node'
    static_configs:
      - targets:
          - '10.10.10.1:9100'
        labels:
          instance_name: gateway

      - targets:
          - '10.10.10.2:9100'
        labels:
          instance_name: application

      - targets:
          - '10.10.10.3:9100'
        labels:
          instance_name: monitoring

  - job_name: 'application'
    static_configs:
      - targets:
          - '10.10.10.2:18081'
        labels:
          app: app1

      - targets:
          - '10.10.10.2:18082'
        labels:
          app: app2
